name: medal-record-fix-v184
on:
  push:
    branches: [medal-king-v183]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medal-king-v183
          fetch-depth: 0
      - name: Apply and verify v184
        run: python .github/medal-record-fix-v184.py
      - name: Remove helpers and commit
        run: |
          rm .github/medal-record-fix-v184.py
          rm .github/workflows/medal-record-fix-v184.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/medal-record-fix-v184.py .github/workflows/medal-record-fix-v184.yml
          git commit -m "Fix record tabs and Barrel date range v184"
          git push origin HEAD:medal-king-v183
