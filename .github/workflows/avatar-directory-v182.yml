name: One-time avatar directory fix v182

on:
  push:
    branches: [avatar-directory-v182]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: avatar-directory-v182
          fetch-depth: 0
      - name: Apply avatar directory patch
        run: python3 tools/avatar_directory_v182.py
      - name: Validate
        run: |
          git diff --check
          grep -q "previousMembers=new Map" index.html
          grep -q "r._member?.avatarUrl" index.html
          grep -q "final182-avatar-sync" index.html
      - name: Commit patch
        run: |
          rm -f .github/workflows/avatar-directory-v182.yml tools/avatar_directory_v182.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render synced profile photos in member directory v182"
          git push origin HEAD:avatar-directory-v182
