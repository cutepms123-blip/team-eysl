name: One-time startup cleanup v179

on:
  push:
    branches: [cleanup-startup-v179]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-startup-v179
          fetch-depth: 0

      - name: Apply direct startup cleanup
        run: python3 tools/cleanup_startup_v179.py

      - name: Validate cleanup
        run: |
          git diff --check
          test ! -e runtime-stability-v178.js
          test ! -e startup-recovery-v163.js
          grep -q "team-eysl-final179-centralized-startup" sw.js
          grep -q "final179-centralized-startup" index.html

      - name: Commit cleanup to branch
        run: |
          rm -f .github/workflows/cleanup-startup-v179.yml tools/cleanup_startup_v179.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize startup flow and remove obsolete recovery helpers v179"
          git push origin HEAD:cleanup-startup-v179
