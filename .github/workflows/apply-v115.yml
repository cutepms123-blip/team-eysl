name: Apply v115 notice poll

on:
  push:
    branches:
      - main
    paths:
      - notice-poll-v115.js
      - scripts/patch_v115.py
      - .github/workflows/apply-v115.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app shell and service worker
        run: python scripts/patch_v115.py

      - name: Verify notice poll integration
        shell: bash
        run: |
          git diff --check
          test -f notice-poll-v115.js
          grep -q "notice-poll-v115.js?v=final115-notice-poll" index.html
          grep -q "final115-notice-poll" index.html
          grep -q "team-eysl-final115-notice-poll" sw.js
          grep -q "notice-poll-v115.js" sw.js
          grep -q "pollV115SubmitVote" notice-poll-v115.js
          grep -q "투표 추가하기" notice-poll-v115.js

      - name: Commit production shell changes
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No shell changes needed."
            exit 0
          fi
          git config user.name "team-eysl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Enable notice polls in app shell"
          git push origin HEAD:main
