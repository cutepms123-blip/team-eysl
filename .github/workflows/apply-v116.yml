name: Apply v116 notice upload fix

on:
  push:
    branches: [main]
    paths:
      - 'notice-upload-fix-v116.js'
      - 'scripts/patch_v116.py'
      - '.github/workflows/apply-v116.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app shell and service worker
        run: python scripts/patch_v116.py
      - name: Verify v116
        run: |
          grep -q 'notice-upload-fix-v116.js?v=final116-notice-upload' index.html
          grep -q 'final116-notice-upload' index.html
          grep -q 'team-eysl-final116-notice-upload' sw.js
          grep -q '/notice-upload-fix-v116.js' sw.js
      - name: Commit patched shell
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'team-eysl-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Enable resilient notice uploads in app shell'
          git push origin HEAD:main
