name: medal-detail-v186
on:
  push:
    branches: [medal-detail-v186]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medal-detail-v186
      - name: Patch medal detail UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""async function loadFunEventRaw(){
 const {data,error}=await dbClient.rpc('get_team_fun_event_rankings_v2');
 if(error||!data)throw(error||new Error('event ranking data error'));
 return data;
}"""
          new="""async function loadFunEventRaw(){
 const {data,error}=await dbClient.rpc('get_team_fun_event_rankings_v2');
 if(error||!data)throw(error||new Error('event ranking data error'));
 window.__EYSL_FUN_EVENT_RAW__=data;
 return data;
}"""
          assert old in s, 'loadFunEventRaw marker not found'
          s=s.replace(old,new,1)

          marker="""function parseRaceSeconds(v){"""
          insert="""function ensureMedalDetailPage(){
 let page=document.getElementById('medalDetail');
 if(page)return page;
 page=document.createElement('section');
 page.id='medalDetail';page.className='page';
 page.innerHTML=`<div class=\"pagehead\"><button class=\"back\" onclick=\"showPage('eventRankingDetail')\">←</button><h1 id=\"medalDetailTitle\">메달 기록</h1><span></span></div><div id=\"medalDetailBody\"></div>`;
 const nav=document.querySelector('.nav');
 if(nav?.parentNode)nav.parentNode.insertBefore(page,nav);else document.querySelector('.app')?.appendChild(page);
 return page;
}
function medalEmoji(v){return v==='gold'?'🥇':v==='silver'?'🥈':'🥉'}
function medalKorean(v){return v==='gold'?'금':v==='silver'?'은':'동'}
function medalRankRows(rows,valueFn,scope){
 const all=rows||[],top=all.slice(0,5),rest=all.slice(5),id=`rank-full-${++rankToggleSeq}`;
 const row=(r,i)=>{const rid=String(r.roster_id||'');return `<div class=\"rankLine compactRankLine\" role=\"button\" tabindex=\"0\" style=\"cursor:pointer\" onclick=\"openMedalDetail('${rid}','${scope}')\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();openMedalDetail('${rid}','${scope}')}\"><div class=\"rankLeft\"><span class=\"rankNo\">${rankDisplay(r.rank||i+1)}</span><b>${escHtml(r.nickname)}</b></div><span class=\"rankValue\">${valueFn(r)} <b aria-hidden=\"true\" style=\"margin-left:4px\">›</b></span></div>`};
 return top.length?top.map(row).join('')+(rest.length?`<div id=\"${id}\" class=\"fullRankingRows\" style=\"display:none\">${rest.map((r,i)=>row(r,i+5)).join('')}</div>${rankToggleButton(all,id)}`:''):'<div class=\"eventRankEmpty\">집계 데이터가 없습니다.</div>';
}
window.openMedalDetail=function(rosterId,scope='all'){
 const data=window.__EYSL_FUN_EVENT_RAW__||{};
 let rows=(data.medal_details||[]).filter(x=>String(x.roster_id)===String(rosterId));
 if(scope==='year')rows=rows.filter(x=>Number(x.event_year)===Number(data.year));
 const rankRows=scope==='year'?(data.medals||[]):(data.medals_all_time||[]);
 const ranked=rankRows.find(x=>String(x.roster_id)===String(rosterId));
 const nickname=rows[0]?.nickname||ranked?.nickname||'팀원';
 const page=ensureMedalDetailPage(),title=page.querySelector('#medalDetailTitle'),body=page.querySelector('#medalDetailBody');
 title.textContent=`${nickname.split('/')[0]} 메달 기록`;
 const gold=rows.filter(x=>x.medal==='gold').length,silver=rows.filter(x=>x.medal==='silver').length,bronze=rows.filter(x=>x.medal==='bronze').length;
 const scopeLabel=scope==='year'?`${data.year}년`:'역대';
 const cards=rows.map(x=>`<div class=\"card\" style=\"margin-bottom:9px\"><div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\"><div style=\"min-width:0\"><b style=\"font-size:15px;line-height:1.4\">${escHtml(x.event_name||'대회')}</b><div class=\"meta\" style=\"margin-top:6px;line-height:1.6\">${escHtml(x.event_detail||'종목 미등록')} · ${x.is_team?'단체전':'개인전'} · ${x.event_type==='fin'?'핀수영대회':'일반대회'}</div></div><span style=\"font-size:22px;white-space:nowrap\">${medalEmoji(x.medal)}</span></div><div style=\"margin-top:9px;font-size:12px;font-weight:800\">${Number(x.event_year)||''} · ${medalKorean(x.medal)}메달</div></div>`).join('');
 body.innerHTML=`<div class=\"card\" style=\"margin-bottom:12px\"><b style=\"font-size:18px\">${escHtml(scopeLabel)} 총 ${rows.length}개</b><div style=\"margin-top:8px;font-size:14px;line-height:1.8\">🥇 ${gold} &nbsp; 🥈 ${silver} &nbsp; 🥉 ${bronze}</div></div>${cards||'<div class=\"card meta\">메달 상세 기록이 없습니다.</div>'}`;
 showPage('medalDetail');
}
"""
          assert marker in s, 'parseRaceSeconds marker not found'
          s=s.replace(marker,insert+marker,1)

          old_medal="""  if(type==='medal'){
   const rows=data.medals||[],allRows=data.medals_all_time||[];
   const medalValue=r=>`총 ${Number(r.total||0)}개 · 🥇 ${Number(r.gold||0)}  🥈 ${Number(r.silver||0)}  🥉 ${Number(r.bronze||0)}`;
   box.innerHTML=`<div class=\"eventDetailStack\"><div class=\"eventRankMini\"><h3>${data.year} 메달왕</h3>${funRankRows(rows,medalValue)}</div><div class=\"eventRankMini\"><h3>역대 메달 누적</h3>${funRankRows(allRows,medalValue)}</div><div class=\"card meta\">개인전과 단체전 메달을 모두 포함해요. 단체전은 해당 출전 선수에게 각각 1개로 집계하고, 동률은 총 메달 수 → 금 → 은 → 동 순으로 정해요. 확인되지 않은 2026 수원 연맹회장배 은메달 1건은 현재 집계에서 제외했어요.</div></div>`;
   return;
  }"""
          new_medal="""  if(type==='medal'){
   const rows=data.medals||[],allRows=data.medals_all_time||[];
   const medalValue=r=>`총 ${Number(r.total||0)}개 · 🥇 ${Number(r.gold||0)}  🥈 ${Number(r.silver||0)}  🥉 ${Number(r.bronze||0)}`;
   box.innerHTML=`<div class=\"eventDetailStack\"><div class=\"eventRankMini\"><h3>${data.year} 메달왕</h3>${medalRankRows(rows,medalValue,'year')}</div><div class=\"eventRankMini\"><h3>역대 메달 누적</h3>${medalRankRows(allRows,medalValue,'all')}</div><div class=\"card meta\">순위의 팀원을 누르면 어떤 대회·종목에서 메달을 땄는지 볼 수 있어요. 개인전·핀수영대회·단체전을 모두 포함하며, 단체전은 해당 출전 선수에게 각각 1개로 집계해요. 동률은 총 메달 수 → 금 → 은 → 동 순으로 정해요. 확인되지 않은 2026 수원 연맹회장배 은메달 1건은 현재 집계에서 제외했어요.</div></div>`;
   return;
  }"""
          assert old_medal in s, 'medal block marker not found'
          s=s.replace(old_medal,new_medal,1)

          old_ver='<section id="teamEvents" class="page"><div class="pagehead"><button class="back" onclick="showPage(\'home\')">←</button><h1>이벤트</h1><span class="meta">v94</span></div><div class="eventHub">'
          new_ver='<section id="teamEvents" class="page"><div class="pagehead"><button class="back" onclick="showPage(\'home\')">←</button><h1>이벤트</h1><span class="meta">v95</span></div><div class="eventHub">'
          if old_ver in s:s=s.replace(old_ver,new_ver,1)

          p.write_text(s)
          PY
          git rm .github/workflows/medal-detail-v186.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add clickable medal history details v186"
          git push origin medal-detail-v186
