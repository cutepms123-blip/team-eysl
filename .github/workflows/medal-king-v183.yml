name: medal-king-v183
on:
  push:
    branches:
      - medal-king-v183
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medal-king-v183
          fetch-depth: 0
      - name: Patch index
        run: python scripts/medal_king_v183.py
      - name: Verify
        run: |
          grep -F "openFunEventPage('medal')" index.html
          grep -F "medal:'메달왕'" index.html
          grep -F "data.medals_all_time" index.html
      - name: Commit product change
        run: |
          rm scripts/medal_king_v183.py
          rm .github/workflows/medal-king-v183.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/medal_king_v183.py .github/workflows/medal-king-v183.yml
          git commit -m "Add medal king event ranking v183"
          git push origin HEAD:medal-king-v183
