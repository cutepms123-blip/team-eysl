name: Attendance persistence patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/attendance-persistence-fix.yml
      - scripts/patch_attendance.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        run: python scripts/patch_attendance.py

      - name: Verify patch
        run: |
          git diff --check
          grep -q "function saveAttendanceEvent" index.html
          grep -q "지각비 납부 완료" index.html
          grep -q "late_fee_paid" index.html
          grep -q "attendanceSaveBtn" index.html

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes were needed."
            exit 0
          fi
          git config user.name "team-eysl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Persist attendance and late-fee status"
          git push origin HEAD:main
